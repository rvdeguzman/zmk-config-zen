# Go to sleep after one hour (1*60*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_POINTING=y

# Report the right half's battery level to the host too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# E-ink: periodic full refresh to clear partial-refresh artifacts (seconds)
CONFIG_ZMK_DISPLAY_FULL_REFRESH_PERIOD=300
# Not using CONFIG_ZMK_DISPLAY_HIDE_MOMENTARY_LAYERS: broken on zen-display-patches-0.3
# (behavior_toggle_layer.c not updated for the new zmk_keymap_layer_activate signature)
