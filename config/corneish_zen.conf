# Go to sleep after one hour (1*60*60*1000ms)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Turn on logging, and set ZMK logging to debug output
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_POINTING=y

# Report the right half's battery level to the host too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# E-ink: no layer widget, so the screen only redraws on battery/connection changes
CONFIG_CUSTOM_WIDGET_LAYER_STATUS=n
# E-ink: hourly power-on style full refresh (controller reset + clear + redraw), seconds
CONFIG_ZMK_DISPLAY_FULL_REFRESH_PERIOD=3600
# E-ink: partial refreshes scan only inside the refresh window (less fading elsewhere)
CONFIG_IL0323_ALTERNATIVE_REFRESH=y
